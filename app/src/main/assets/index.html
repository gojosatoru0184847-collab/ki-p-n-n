<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zombie Game</title>
<style>
html,body{margin:0;background:#000;height:100%;overflow:hidden}
#wrap{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#ui{pointer-events:none}
#adBtn{position:fixed;top:16px;right:16px;z-index:9;padding:10px 12px;border:0;border-radius:10px;
  background:#ffcc66;color:#111;font-weight:700}
#gfxBtn{position:fixed;top:16px;left:16px;z-index:9;padding:10px 12px;border:0;border-radius:10px;
  background:#7c7cff;color:#fff;font-weight:700}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:9;
  padding:10px 14px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;
  font:600 13px system-ui, -apple-system, Segoe UI, Roboto, Arial;opacity:0;transition:.2s}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <canvas id="ui"></canvas>
</div>
<button id="gfxBtn">Graphics: High</button>
<button id="adBtn">Xem QC +100 vàng</button>
<div id="toast"></div>

<script type="module" src="game/main.js"></script>
</body>
</html>
