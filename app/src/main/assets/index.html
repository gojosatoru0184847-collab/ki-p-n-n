<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>ANGER OF STICK: ZOMBIE — WebGL</title>
  <style>
    :root{
      --bg:#05050b;
      --panel: rgba(10,10,18,.70);
      --panel2: rgba(20,20,40,.85);
      --txt:#e9ecff;
      --muted:#aab0d6;
      --good:#5cffb1;
      --warn:#ffd66b;
      --bad:#ff6b7a;
      --vip1:#7c5cff;
      --vip2:#ffd24d;
      --bd: rgba(255,255,255,.12);
      --sh: 0 14px 40px rgba(0,0,0,.55);
      --r: 14px;
    }

    html,body{
      margin:0; height:100%;
      background: radial-gradient(1200px 700px at 65% 20%, rgba(124,92,255,.20), transparent 55%),
                  radial-gradient(900px 600px at 25% 75%, rgba(255,210,77,.18), transparent 55%),
                  var(--bg);
      color:var(--txt);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji";
      overflow:hidden;
      -webkit-tap-highlight-color: transparent;
      user-select:none;
      touch-action:none;
    }

    /* Canvas full screen */
    #gl{
      position:fixed;
      inset:0;
      width:100vw;
      height:100vh;
      display:block;
      background:#000;
    }

    /* Top HUD */
    .hud-top{
      position:fixed;
      left: env(safe-area-inset-left, 10px);
      right: env(safe-area-inset-right, 10px);
      top: env(safe-area-inset-top, 10px);
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      padding:10px;
      pointer-events:none;
    }
    .chip{
      pointer-events:auto;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      background: var(--panel);
      border:1px solid var(--bd);
      box-shadow: var(--sh);
      backdrop-filter: blur(8px);
      font-weight:700;
      letter-spacing:.2px;
      font-size:13px;
    }
    .chip small{ color:var(--muted); font-weight:600; }
    .vip{
      border:1px solid rgba(255,210,77,.35);
      background: linear-gradient(135deg, rgba(124,92,255,.35), rgba(255,210,77,.22));
      position:relative;
      overflow:hidden;
    }
    .vip:before{
      content:"";
      position:absolute;
      inset:-40px;
      background: conic-gradient(from 90deg, rgba(255,210,77,.0), rgba(255,210,77,.35), rgba(124,92,255,.0));
      animation: spin 3.8s linear infinite;
      opacity:.65;
    }
    .vip > *{ position:relative; z-index:1; }
    @keyframes spin{ to{ transform:rotate(360deg); } }

    /* Bottom controls */
    .hud-bot{
      position:fixed;
      left: env(safe-area-inset-left, 10px);
      right: env(safe-area-inset-right, 10px);
      bottom: env(safe-area-inset-bottom, 10px);
      display:flex;
      gap:10px;
      align-items:flex-end;
      justify-content:space-between;
      padding:10px;
      pointer-events:none;
    }
    .group{
      pointer-events:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .btn{
      border:1px solid var(--bd);
      background: var(--panel2);
      color:var(--txt);
      padding:12px 14px;
      border-radius:12px;
      font-weight:800;
      font-size:14px;
      box-shadow: var(--sh);
      backdrop-filter: blur(8px);
      cursor:pointer;
      transition: transform .08s ease, filter .15s ease;
    }
    .btn:active{ transform: translateY(1px) scale(.99); }
    .btn.vipbtn{
      border:1px solid rgba(255,210,77,.35);
      background: linear-gradient(135deg, rgba(124,92,255,.55), rgba(255,210,77,.28));
    }
    .btn.ghost{
      background: rgba(0,0,0,.25);
    }
    .btn.bad{
      border-color: rgba(255,107,122,.35);
      background: rgba(255,107,122,.12);
    }

    /* Center banner / status */
    .center{
      position:fixed;
      left:50%;
      top:50%;
      transform: translate(-50%,-50%);
      width:min(520px, 92vw);
      border-radius:18px;
      background: rgba(10,10,18,.65);
      border:1px solid rgba(255,255,255,.10);
      box-shadow: var(--sh);
      backdrop-filter: blur(10px);
      padding:16px 16px 14px;
      pointer-events:none;
    }
    .title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
      pointer-events:none;
    }
    .title h1{
      margin:0;
      font-size:16px;
      letter-spacing:.4px;
    }
    .badge{
      font-weight:900;
      font-size:12px;
      padding:6px 10px;
      border-radius:999px;
      background: linear-gradient(135deg, rgba(124,92,255,.45), rgba(255,210,77,.22));
      border:1px solid rgba(255,210,77,.30);
    }
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:10px;
      pointer-events:auto;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 10px;
      border-radius:999px;
      border:1px solid var(--bd);
      background: rgba(0,0,0,.25);
      font-size:12px;
      font-weight:800;
    }
    .dot{
      width:9px;height:9px;border-radius:50%;
      background: var(--warn);
      box-shadow: 0 0 14px rgba(255,210,77,.45);
    }
    .dot.good{ background: var(--good); box-shadow:0 0 14px rgba(92,255,177,.45); }
    .dot.bad{ background: var(--bad); box-shadow:0 0 14px rgba(255,107,122,.45); }

    /* Log panel */
    #log{
      position:fixed;
      left:10px;
      right:10px;
      top: calc(env(safe-area-inset-top, 10px) + 62px);
      max-height: 32vh;
      overflow:auto;
      padding:10px;
      border-radius:14px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.35);
      backdrop-filter: blur(8px);
      box-shadow: var(--sh);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size:12px;
      color:#dfe4ff;
      display:none;
      white-space:pre-wrap;
      pointer-events:auto;
    }

    /* Hide center once started */
    .hidden{ display:none !important; }
  </style>
</head>
<body>
  <canvas id="gl"></canvas>

  <!-- TOP HUD -->
  <div class="hud-top">
    <div class="chip vip">
      <span style="font-weight:900">VIP PRO</span>
      <small id="vipInfo">Booting…</small>
    </div>

    <div class="chip">
      <span>FPS:</span> <span id="fps">0</span>
      <small id="gfxLabel">GFX: High</small>
    </div>
  </div>

  <!-- CENTER STATUS -->
  <div class="center" id="centerBox">
    <div class="title">
      <h1>ANGER OF STICK: ZOMBIE</h1>
      <div class="badge">WEBVIEW • WEBGL</div>
    </div>

    <div style="color:var(--muted); font-weight:700; font-size:13px; line-height:1.35">
      Nếu bạn thấy màn hình đỏ/động → WebGL OK. Nếu đen/đứng → xem log để biết lỗi.
    </div>

    <div class="row">
      <div class="pill"><span class="dot" id="dotWebgl"></span> WebGL</div>
      <div class="pill"><span class="dot" id="dotLoop"></span> Render loop</div>
      <div class="pill"><span class="dot" id="dotCanvas"></span> Canvas resize</div>
      <button class="btn ghost" id="toggleLogBtn" type="button">Bật Log</button>
    </div>
  </div>

  <!-- LOG -->
  <div id="log"></div>

  <!-- BOTTOM CONTROLS -->
  <div class="hud-bot">
    <div class="group">
      <button class="btn" id="gfxBtn" type="button">Graphics: High</button>
      <button class="btn vipbtn" id="adBtn" type="button">Xem QC +100 vàng</button>
    </div>

    <div class="group">
      <button class="btn" id="startBtn" type="button">Start</button>
      <button class="btn" id="skillBtn" type="button">Skill</button>
      <button class="btn bad" id="pauseBtn" type="button">Pause</button>
    </div>
  </div>

  <script>
    // =========================
    //  VIP PRO WEBGL BOOT FILE
    //  - Fix canvas size + viewport
    //  - Stable render loop
    //  - Debug log overlay
    // =========================

    const $ = (id)=>document.getElementById(id);

    const canvas = $("gl");
    const logBox = $("log");
    const fpsEl = $("fps");
    const gfxBtn = $("gfxBtn");
    const startBtn = $("startBtn");
    const skillBtn = $("skillBtn");
    const pauseBtn = $("pauseBtn");
    const adBtn = $("adBtn");
    const vipInfo = $("vipInfo");

    const dotWebgl = $("dotWebgl");
    const dotLoop  = $("dotLoop");
    const dotCanvas= $("dotCanvas");
    const centerBox= $("centerBox");
    const toggleLogBtn = $("toggleLogBtn");

    let gl = null;
    let running = false;
    let paused = false;
    let quality = "high"; // high|low
    let gold = 0;

    // Debug logger
    function log(...args){
      const msg = args.map(a => (typeof a === "string" ? a : JSON.stringify(a))).join(" ");
      console.log("[VIP]", msg);
      if(logBox.style.display !== "none"){
        logBox.textContent += msg + "\n";
        logBox.scrollTop = logBox.scrollHeight;
      }
    }

    function setDot(el, state){
      // state: "good"|"bad"|"warn"
      el.classList.remove("good","bad");
      if(state === "good") el.classList.add("good");
      if(state === "bad") el.classList.add("bad");
      // warn = default
    }

    function showLog(show){
      logBox.style.display = show ? "block" : "none";
      toggleLogBtn.textContent = show ? "Tắt Log" : "Bật Log";
    }

    toggleLogBtn.onclick = () => {
      const on = logBox.style.display === "none";
      showLog(on);
      if(on) log("Log enabled.");
    };

    // Prevent long-press selection/scroll issues on mobile
    window.addEventListener("contextmenu", e => e.preventDefault());
    window.addEventListener("gesturestart", e => e.preventDefault?.());

    // ===== Canvas resize (CRITICAL) =====
    function resize(){
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const w = Math.floor(window.innerWidth * dpr);
      const h = Math.floor(window.innerHeight * dpr);

      if(canvas.width !== w || canvas.height !== h){
        canvas.width = w;
        canvas.height = h;
        if(gl) gl.viewport(0,0,w,h);
        log("resize:", w+"x"+h, "dpr:", dpr.toFixed(2));
      }
      setDot(dotCanvas, "good");
    }
    window.addEventListener("resize", resize, {passive:true});

    // ===== WebGL init =====
    function initGL(){
      try{
        gl = canvas.getContext("webgl", {
          alpha: false,
          antialias: true,
          depth: false,
          stencil: false,
          premultipliedAlpha: false,
          preserveDrawingBuffer: false
        }) || canvas.getContext("experimental-webgl");

        if(!gl){
          setDot(dotWebgl, "bad");
          log("ERROR: WebGL not supported in this WebView/device.");
          vipInfo.textContent = "WebGL: NOT SUPPORTED";
          return false;
        }

        setDot(dotWebgl, "good");
        vipInfo.textContent = "WebGL: OK • Tap Start";
        log("WebGL OK. Version:", gl.getParameter(gl.VERSION));
        return true;
      }catch(e){
        setDot(dotWebgl, "bad");
        log("ERROR initGL:", String(e));
        vipInfo.textContent = "WebGL: ERROR";
        return false;
      }
    }

    // ===== Simple "game" renderer (safe) =====
    // We keep it minimal so WebView won't choke.
    let t0 = performance.now();
    let frames = 0;
    let lastFpsTime = performance.now();
    let fps = 0;

    function render(now){
      if(!running) return;

      if(paused){
        requestAnimationFrame(render);
        return;
      }

      resize();

      // Clear (test visible, not black)
      // High quality: animated gradient-ish
      // Low quality: solid color
      const time = (now - t0) * 0.001;

      if(quality === "high"){
        const r = 0.35 + 0.35*Math.sin(time*1.3);
        const g = 0.08 + 0.12*Math.sin(time*1.7 + 1.5);
        const b = 0.18 + 0.18*Math.sin(time*1.1 + 2.2);
        gl.clearColor(r, g, b, 1.0);
      }else{
        gl.clearColor(0.12, 0.12, 0.18, 1.0);
      }
      gl.clear(gl.COLOR_BUFFER_BIT);

      // FPS counter
      frames++;
      const dt = now - lastFpsTime;
      if(dt >= 500){
        fps = Math.round((frames * 1000) / dt);
        frames = 0;
        lastFpsTime = now;
        fpsEl.textContent = String(fps);
      }

      requestAnimationFrame(render);
    }

    function start(){
      if(!gl){
        log("start: no GL context");
        return;
      }
      if(running) return;
      running = true;
      paused = false;
      setDot(dotLoop, "good");
      centerBox.classList.add("hidden");
      log("Game started.");
      requestAnimationFrame(render);
    }

    function pauseToggle(){
      if(!running) return;
      paused = !paused;
      pauseBtn.textContent = paused ? "Resume" : "Pause";
      log(paused ? "Paused." : "Resumed.");
    }

    function useSkill(){
      if(!running) return;
      // VIP fake skill effect: toggle flash
      log("Skill: VIP DASH!");
      vipInfo.textContent = "VIP DASH! +speed";
      setTimeout(()=>{ vipInfo.textContent = "WebGL: OK • Running"; }, 900);
    }

    function toggleGfx(){
      quality = (quality === "high") ? "low" : "high";
      gfxBtn.textContent = "Graphics: " + (quality === "high" ? "High" : "Low");
      $("gfxLabel").textContent = "GFX: " + (quality === "high" ? "High" : "Low");
      log("Graphics:", quality);
    }

    function watchAd(){
      // Fake ad reward: +100 gold
      gold += 100;
      log("Ad watched (fake). +100 gold =>", gold);
      vipInfo.textContent = "Nhận +100 vàng! Tổng: " + gold;
      setTimeout(()=>{ vipInfo.textContent = running ? "WebGL: OK • Running" : "WebGL: OK • Tap Start"; }, 1200);
    }

    // Buttons
    gfxBtn.onclick = toggleGfx;
    startBtn.onclick = start;
    pauseBtn.onclick = pauseToggle;
    skillBtn.onclick = useSkill;
    adBtn.onclick = watchAd;

    // Boot
    (function boot(){
      showLog(false);
      resize();
      const ok = initGL();
      if(!ok){
        // show log automatically if WebGL not supported
        showLog(true);
        log("TIP: Bật hardwareAcceleration + setLayerType(HARDWARE) trong MainActivity.");
      }else{
        // Mark loop as not started yet (warn)
        setDot(dotLoop, "warn");
      }
    })();

    // Catch errors
    window.addEventListener("error", (e)=>{
      showLog(true);
      log("JS ERROR:", e.message, "at", (e.filename||"") + ":" + (e.lineno||""));
      setDot(dotLoop, "bad");
    });
    window.addEventListener("unhandledrejection", (e)=>{
      showLog(true);
      log("PROMISE REJECT:", String(e.reason || e));
      setDot(dotLoop, "bad");
    });
  </script>
</body>
</html>
