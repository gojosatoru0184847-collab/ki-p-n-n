<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <title>Game</title>
  <style>
    html,body{
      margin:0; width:100%; height:100%;
      background:#000; overflow:hidden;
      touch-action:none;
    }
    #wrap{position:fixed; inset:0;}
    canvas{position:absolute; inset:0; width:100%; height:100%; display:block;}
    /* UI overlay sample */
    #hud{position:fixed; left:12px; bottom:12px; z-index:10; display:flex; gap:10px}
    button{padding:10px 12px;font-size:14px}
    #toast{position:fixed; left:50%; bottom:80px; transform:translateX(-50%);
      background:rgba(0,0,0,.7); color:#fff; padding:8px 12px; border-radius:10px;
      opacity:0; transition:.2s; z-index:20; font-family:system-ui}
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <canvas id="ui"></canvas>
  </div>

  <div id="hud">
    <button id="gfxBtn">Graphics: High</button>
    <button id="adBtn">Xem QC +100 vàng</button>
  </div>
  <div id="toast"></div>

  <!-- QUAN TRỌNG: module để import chạy được -->
  <script type="module" src="./main.js"></script>
</body>
</html>
