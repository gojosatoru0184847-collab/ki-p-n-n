name: Android Build (APK + AAB) - No Wrapper Jar

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ✅ Không dùng ./gradlew (vì thiếu gradle-wrapper.jar)
      - name: Install Gradle 8.2
        run: |
          set -e
          GRADLE_VERSION=8.2
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          gradle -v

      - name: Make sure gradlew is executable (optional)
        run: chmod +x gradlew || true

      - name: Build Release APK + AAB
        run: |
          set -e
          gradle --no-daemon clean
          gradle --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
