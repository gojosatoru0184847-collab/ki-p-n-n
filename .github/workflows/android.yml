name: Android Build (APK + AAB) - Auto Fix (No Wrapper Jar)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK setup
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages + accept licenses
        run: |
          set -e
          yes | sdkmanager --licenses
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Build (try Gradle 8.2, fallback 7.6.4)
        shell: bash
        run: |
          set +e

          build_with_gradle () {
            local GV="$1"
            echo "=============================="
            echo "👉 Trying Gradle $GV"
            echo "=============================="

            rm -rf "gradle-$GV" gradle.zip

            curl -L -o gradle.zip "https://services.gradle.org/distributions/gradle-${GV}-bin.zip"
            unzip -q gradle.zip

            export PATH="$PWD/gradle-${GV}/bin:$PATH"
            gradle -v

            # --stacktrace để thấy lỗi thật sự trong log
            gradle --no-daemon --stacktrace --info clean
            gradle --no-daemon --stacktrace --info :app:assembleRelease :app:bundleRelease
            return $?
          }

          build_with_gradle "8.2"
          CODE=$?

          if [ $CODE -ne 0 ]; then
            echo "❌ Gradle 8.2 failed -> fallback to 7.6.4"
            build_with_gradle "7.6.4"
            CODE=$?
          fi

          if [ $CODE -ne 0 ]; then
            echo "❌ Both Gradle versions failed."
            exit 1
          fi

          echo "✅ Build success."

      - name: Upload APK/AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
